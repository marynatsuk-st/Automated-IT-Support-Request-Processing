<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Login{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      /* Paste the CSS from the section above right here */
      :root {
        --portal-dark-green: #2E6F40;
        --portal-accent-green: #29AB87;
        --portal-bg-light: #F5F5F5;
        --portal-card-bg: #FFFFFF;
        --portal-text-dark: #333;
      }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--portal-bg-light);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 2.5rem;
        margin: auto;
        background-color: var(--portal-card-bg);
        border-radius: 0.75rem;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
        border: 1px solid #e9ecef;
      }
      .login-container h2 {
        text-align: center;
        color: var(--portal-dark-green);
        font-weight: 600;
        margin-bottom: 1.5rem;
      }
      /* Use mb-3 for BS5, but .form-group works for this demo */
      .form-group { margin-bottom: 1.25rem; }
      .form-control {
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        border: 1px solid #ced4da;
      }
      .form-control:focus {
        border-color: var(--portal-accent-green);
        box-shadow: 0 0 0 0.25rem rgba(41, 171, 135, 0.25);
      }
      label { font-weight: 500; color: var(--portal-text-dark); }
      .form-check-input:checked {
        background-color: var(--portal-dark-green);
        border-color: var(--portal-dark-green);
      }
      .form-check-input:focus {
        border-color: var(--portal-accent-green);
        box-shadow: 0 0 0 0.25rem rgba(41, 171, 135, 0.25);
      }
      .form-group a {
        color: var(--portal-accent-green);
        text-decoration: none;
        font-size: 0.9em;
      }
      .form-group a:hover { text-decoration: underline; }
      .btn-primary {
        background-color: var(--portal-dark-green);
        border-color: var(--portal-dark-green);
        font-weight: 600;
        width: 100%;
        padding: 0.75rem;
        border-radius: 0.5rem;
        transition: background-color 0.15s ease-in-out;
      }
      .btn-primary:hover {
        background-color: #245a33;
        border-color: #245a33;
      }
      .btn-primary:focus, .btn-primary:active {
        background-color: #245a33;
        border-color: #245a33;
        box-shadow: 0 0 0 0.25rem rgba(41, 171, 135, 0.5);
      }
      .login-logo {
        text-align: center;
        margin-bottom: 1rem;
      }
      .login-logo img {
        width: 72px;
        height: auto;
      }
    </style>
  </head>

  <body class="text-center">

    <main class="login-container">
      {% block content %}
      <div class="login-logo">
        
      </div>

      <form method="POST">
        <h2>Login</h2>

        <div class="form-group">
          <label for="username">Username</label>
          <input class="form-control" type="text" name="username" id="username" required placeholder="Enter your username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" name="password" id="password" required placeholder="Enter your password">
        </div>

        <div class="form-group form-check text-start">
          <input type="checkbox" class="form-check-input" id="remember" name="remember">
          <label class="form-check-label" for="remember">Remember me. </label>
        </div>

        <div class="form-group text-start">
          <a href="{{ url_for('auth.remind_password') }}">Remind password</a>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>
      {% endblock %}
    </main>

  </body>
</html>
