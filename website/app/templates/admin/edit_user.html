{% extends "admin/admin_base.html" %}
{% block title %}Редагувати користувача: {{ user.full_name }}{% endblock %}

{% block content %}
<h1>Редагувати користувача: {{ user.full_name }}</h1>

<form method="POST" class="form-container">
    <div class="left-column">
        <div class="form-group">
            <label for="name">Ім'я (First Name)</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required/>
        </div>
        <div class="form-group">
            <label for="surname">Прізвище (Last Name)</label>
            <input type="text" class="form-control" id="surname" name="surname" value="{{ user.surname }}" required/>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required/>
        </div>
        <div class="form-group">
    <label for="phone">Телефон</label>
    <input 
        type="tel" 
        class="form-control" 
        id="phone" 
        name="phone"
        
        value="{{ user.phone or '+380' }}" 
        
        required
        
        pattern="\+380\d{9}"
        
        title="Номер телефону має бути у форматі +380XXXXXXXXX (12 цифр)"
        
        placeholder="+380991234567"
        
        maxlength="13" 
    />
</div>
        <div class="form-group">
            <label for="date_of_birth">Дата народження</label>
            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ user.date_of_birth.strftime('%Y-%m-%d') if user.date_of_birth else '' }}" required/>
        </div>
    </div>

    <div class="right-column">
        <div class="form-group">
            <label for="username">Ім'я користувача (Username)</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required/>
        </div>
        <div class="form-group">
            <label for="password1">Новий пароль (залиште порожнім, щоб не змінювати)</label>
            <input type="password" class="form-control" id="password1" name="password1" placeholder="Введіть новий пароль"/>
        </div>
        
        <div class="form-group">
            <label for="department_id">Відділ</label>
            <select name="department_id" id="department_id" class="form-control" required>
                {% for department in departments %}
                    <option value="{{ department.department_id }}"
                            {% if current_department_record and current_department_record.department_id == department.department_id %}selected{% endif %}>
                        {{ department.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="title">Посада</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ current_department_record.title if current_department_record else '' }}" required>
        </div>

        <div class="form-group">
            <label for="role">Роль</label>
            <select id="role" name="role" class="form-control" required>
                {% for role in roles %}
                    <option value="{{ role.role_id }}" {% if current_role_record and current_role_record.role_id == role.role_id %}selected{% endif %}>
                        {{ role.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="worker_status">Статус працівника</label>
            <select name="worker_status" id="worker_status" class="form-control">
                {% for status in status_options %}
                    <option value="{{ status.value }}" {% if user.worker_status == status %}selected{% endif %}>
                        {{ status.value.replace('_', ' ')|title }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="unavailable_until">Недоступний до:</label>
            <input type="date" class="form-control" id="unavailable_until" name="unavailable_until"
                   value="{{ user.unavailable_until.strftime('%Y-%m-%d') if user.unavailable_until else '' }}">
        </div>
    </div>

    <div class="full-width-column">
        <div class="button-group">
            <button type="submit" class="btn btn-primary">Зберегти зміни</button>
            <a href="{{ url_for('admin_views.admin_dashboard') }}" class="btn btn-cancel">Скасувати</a>
        </div>
    </div>
</form>
{% endblock %}
