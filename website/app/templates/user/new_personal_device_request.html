{% extends "user/user_base.html" %}
{% block title %}Запит на новий пристрій{% endblock %}

{% block content %}
<div class="content-container">
    <div class="form-section">
        <h2>Запит на новий особистий пристрій</h2>
        <form method="POST" class="simple-form">
            <div class="form-group">
                <label for="device_type_id">1. Оберіть тип пристрою:</label>
                <select id="device_type_id" name="device_type_id" required>
                    <option value="" disabled selected>-- Тип пристрою --</option>
                    {% for type in device_types %}
                        <option value="{{ type.id }}">{{ type.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="attributes-container">
                </div>

            <div class="form-group">
                <label for="justification">2. Обґрунтування (навіщо потрібен пристрій):</label>
                <textarea id="justification" name="justification" rows="3"
                          placeholder="Наприклад: Поточний ноутбук застарів і повільно працює."
                          required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Відправити запит</button>
             <a href="{{ url_for('user_views.user_dashboard') }}" class="btn btn-cancel">Скасувати</a>
        </form>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const typeSelect = document.getElementById('device_type_id');
        const attributesContainer = document.getElementById('attributes-container');

        typeSelect.addEventListener('change', function() {
            const typeId = this.value;
            attributesContainer.innerHTML = '<p>Завантаження характеристик...</p>';

            if (!typeId) {
                attributesContainer.innerHTML = '';
                return;
            }

            // AJAX-запит до API адміністратора (він доступний всім залогіненим)
            fetch(`/assets/api/attributes/${typeId}`)
                .then(response => response.json())
                .then(attributes => {
                    attributesContainer.innerHTML = '';
                    if (attributes.length > 0) {
                         const header = document.createElement('h4');
                         header.style.marginTop = '20px';
                         header.textContent = "Бажані характеристики (необов'язково)";
                         attributesContainer.appendChild(header);
                    }

                    attributes.forEach(attr => {
                        const formGroup = document.createElement('div');
                        formGroup.className = 'form-group';

                        const label = document.createElement('label');
                        label.htmlFor = `attr_${attr.id}`;
                        label.textContent = attr.name;

                        const input = document.createElement('input');
                        if (attr.data_type === 'integer' || attr.data_type === 'decimal') {
                            input.type = 'number';
                            input.step = (attr.data_type === 'decimal') ? '0.1' : '1';
                        } else {
                            input.type = 'text';
                        }
                        input.id = `attr_${attr.id}`;
                        input.name = `attr_${attr.id}`;
                        input.className = 'form-control';
                        input.placeholder = `Введіть ${attr.name.toLowerCase()}`;

                        formGroup.appendChild(label);
                        formGroup.appendChild(input);
                        attributesContainer.appendChild(formGroup);
                    });
                })
                .catch(error => console.error('Error fetching attributes:', error));
        });
    });
</script>
{% endblock %}
