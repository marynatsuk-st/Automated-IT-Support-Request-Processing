{% extends "admin/admin_base.html" %}
{% block title %}Редагувати тип завдання{% endblock %}

{% block content %}
<div class="content-container">
    <div class="form-section">
        <h2>Редагувати тип завдання: {{ task_type.name }}</h2>
        
        <form method="POST" class="simple-form">
            <div class="form-group">
                <label for="name">Назва типу завдання</label>
                <input type="text" id="name" name="name" value="{{ task_type.name }}" required minlength="3">
            </div>
            <div class="form-group">
                <label for="priority">Пріоритет (1-5)</label>
                <input type="number" id="priority" name="priority" value="{{ task_type.priority }}" min="1" max="5" required>
                <small>1 - Низький, 2 - Середній, 3 - Високий, 4 - Дуже високий, 5 - Критичний</small>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Зберегти зміни</button>
                <a href="{{ url_for('asset_views.manage_task_types') }}" class="btn btn-cancel">Скасувати</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
