{% extends "admin/admin_base.html" %}
{% block title %}Редагувати пристрій{% endblock %}

{% block content %}
<div class="content-container">
    <div class="form-section">
        <h2>Редагувати пристрій: {{ device.name }}</h2>
        
        <form method="POST" class="simple-form">
            <div class="form-group">
                <label for="name">Назва пристрою (Модель)</label>
                <input type="text" id="name" name="name" value="{{ device.name }}" required>
            </div>
            <div class="form-group">
                <label for="serial_number">Серійний номер</label>
                <input type="text" id="serial_number" name="serial_number" value="{{ device.serial_number }}" required>
            </div>
            <div class="form-group">
                <label for="device_type_id">Тип пристрою</label>
                <select id="device_type_id" name="device_type_id" required>
                    {% for type in all_device_types %}
                        <option value="{{ type.id }}" {% if device.device_type_id == type.id %}selected{% endif %}>
                            {{ type.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <hr>
            <h3>Характеристики</h3>
            <div id="attributes-container">
                </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Зберегти зміни</button>
                <a href="{{ url_for('asset_views.view_devices') }}" class="btn btn-cancel">Скасувати</a>
            </div>
        </form>
    </div>
</div>

<script>
    const currentAttributeValues = JSON.parse('{{ current_attribute_values|tojson | safe }}');

    document.addEventListener('DOMContentLoaded', function() {
        const typeSelect = document.getElementById('device_type_id');
        const attributesContainer = document.getElementById('attributes-container');

        function loadAttributesForType(typeId) {
            attributesContainer.innerHTML = '<p>Завантаження характеристик...</p>';

            fetch(`/assets/api/attributes/${typeId}`)
                .then(response => response.json())
                .then(attributes => {
                    attributesContainer.innerHTML = '';
                    if (attributes.length === 0) {
                        attributesContainer.innerHTML = '<p>Для цього типу пристроїв не визначено жодних характеристик.</p>';
                    } else {
                        attributes.forEach(attr => {
                            const formGroup = document.createElement('div');
                            formGroup.className = 'form-group';
                            
                            const label = document.createElement('label');
                            label.htmlFor = `attr_${attr.id}`;
                            label.textContent = attr.name;
                            
                            const input = document.createElement('input');
                            if (attr.data_type === 'integer' || attr.data_type === 'decimal') {
                                input.type = 'number';
                                input.step = (attr.data_type === 'decimal') ? '0.1' : '1';
                            } else {
                                input.type = 'text';
                            }
                            input.id = `attr_${attr.id}`;
                            input.name = `attr_${attr.id}`;
                            input.className = 'form-control';
                            
                            // B-) Заповнюємо поле поточним значенням, якщо воно є
                            if (currentAttributeValues[attr.id]) {
                                input.value = currentAttributeValues[attr.id];
                            }
                            
                            formGroup.appendChild(label);
                            formGroup.appendChild(input);
                            attributesContainer.appendChild(formGroup);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error fetching attributes:', error);
                    attributesContainer.innerHTML = '<p>Помилка завантаження характеристик.</p>';
                });
        }

        // Завантажуємо атрибути для поточного типу пристрою при першому завантаженні сторінки
        if (typeSelect.value) {
            loadAttributesForType(typeSelect.value);
        }

        // Перезавантажуємо атрибути при зміні типу пристрою
        typeSelect.addEventListener('change', function() {
            loadAttributesForType(this.value);
        });
    });
</script>
{% endblock %}
