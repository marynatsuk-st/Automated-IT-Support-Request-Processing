{% extends "manager/manager_base.html" %}

{% block title %}Перегляд заявки #{{ assignment.task.id }}{% endblock %}

{% block content %}
<div class="content-container">
    <div class="form-section">
        <h3>Редагування заявки</h3>
        <form method="POST" class="simple-form">
            <div class="form-group">
                <label for="tasktype_id">Тип завдання:</label>
                <select id="tasktype_id" name="tasktype_id" required>
                    {% for type in all_task_types %}
                        <option value="{{ type.tasktype_id }}" 
                                {% if type.tasktype_id == assignment.task.active_task_type.tasktype_id %}selected{% endif %}>
                            {{ type.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="worker_id">Виконавець:</label>
                <select id="worker_id" name="worker_id" required>
                    <option value="{{ assignment.worker_id }}" selected>{{ assignment.worker.full_name }}</option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Зберегти зміни</button>
                <a href="{{ url_for('manager_views.manager_dashboard') }}" class="btn btn-cancel">До списку завдань</a>
            </div>
        </form>
    </div>
</div>

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const typeSelect = document.getElementById('tasktype_id');
        const workerSelect = document.getElementById('worker_id');
        // Зберігаємо початкового виконавця, щоб можна було його вибрати, якщо він є у новому списку
        const initialWorkerId = '{{ assignment.worker_id }}';

        function updateWorkerList(typeId) {
            workerSelect.disabled = true;
            workerSelect.innerHTML = '<option value="" disabled selected>Завантаження працівників...</option>';

            if (!typeId) {
                workerSelect.innerHTML = '<option value="" disabled selected>Спочатку оберіть тип</option>';
                return;
            }

            // Робимо AJAX-запит до нашого нового API
            fetch(`/manager/api/workers_for_type/${typeId}`)
                .then(response => response.json())
                .then(workers => {
                    workerSelect.innerHTML = ''; // Очищуємо список
                    if (workers.length > 0) {
                        workers.forEach(worker => {
                            const option = document.createElement('option');
                            option.value = worker.id;
                            option.textContent = worker.full_name;
                            // Якщо ID працівника збігається з початковим, робимо його вибраним
                            if (worker.id == initialWorkerId) {
                                option.selected = true;
                            }
                            workerSelect.appendChild(option);
                        });
                        workerSelect.disabled = false;
                    } else {
                        workerSelect.innerHTML = '<option value="" disabled selected>Працівників з такою компетенцією не знайдено</option>';
                    }
                })
                .catch(error => console.error('Error fetching workers:', error));
        }

        // Завантажуємо список працівників для поточного типу при першому завантаженні сторінки
        if (typeSelect.value) {
            updateWorkerList(typeSelect.value);
        }

        // Додаємо "слухача" на зміну типу завдання
        typeSelect.addEventListener('change', function() {
            updateWorkerList(this.value);
        });
    });
</script>
{% endblock %}
{% endblock %}
