{% extends "admin/admin_dashboard.html" %} 
{% block title %}Create user{% endblock %} 

{% block content %}
<h1> This is create user block </h1>

<form method="POST" class="form-container">
    <h3 class="form-title">Create a new user</h3>
    <div class="left-column">
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter first name" required/> 
        </div>
        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Enter last name" required/> 
        </div>
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="Enter title" required/> 
        </div>
        <div class="form-group">
            <label for="date_of_birth">Date of Birth</label>
            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" required />
        </div>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required/> 
        </div>
        <div class="form-group">
            <label for="password1">Password</label>
            <input type="password" class="form-control" id="password1" name="password1" placeholder="Enter password" required/> 
        </div>
    </div>
    
    <div class="left-column">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required/> 
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter phone" required/> 
        </div>
        
            <div class="form-group">
                <label for="department">Department:</label>
                <select id="department" name="department_id" class="form-control" >
                    <option value="" disabled {% if not selected_department_id %}selected{% endif %}>Select Department</option>
                    {% for department in departments %}
                        <option value="{{ department.department_id }}" {% if department.department_id == selected_department_id %}selected{% endif %}>
                            {{ department.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" class="form-control" required>
                <option value="" disabled selected>Select Role</option>
                {% for role in roles %}
                    <option value="{{ role.role_id }}">{{ role.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="manager">Manager:</label>
            <select id="manager" name="manager" class="form-control" {% if not managers %}disabled{% endif %}>
                <option value="" disabled selected>Select Manager</option>
                {% for manager in managers %}
                    <option value="{{ manager.worker_id }}">{{ manager.name }} {{ manager.surname }}</option>
                {% endfor %}
            </select>
        </div>

        
        <div class="button-group">
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="{{ url_for('admin_views.admin_dashboard') }}" class="btn btn-cancel">Cancel</a>
        </div>
    </div>
</form>

{% endblock %}
